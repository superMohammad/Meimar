[project]
name = "llm-fill"
version = "0.1.0"
description = "Grounded LLM extraction of missing real-estate attributes from Arabic listing text via local Ollama"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "structlog>=24.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.0",
]

# The notebooks run on the GPU stack, which the extraction package itself does
# not need. Declared here so `!pip install` lines do not have to live in cells.
[project.optional-dependencies]
gpu = [
    "cudf-cu13>=26.8",
    "cuml-cu13>=26.8",
    "dask-cudf-cu13>=26.8",
    "cupy-cuda13x>=14.1",
    "xgboost>=3.4",
    "scikit-learn>=1.9",
    "nvidia-ml-py>=13.6",
]
notebook = [
    "ipykernel>=7.3",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "plotly>=6.9",
]

[project.scripts]
llm-fill = "llm_fill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
